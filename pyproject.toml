[project]
name = "mithril-llm"
version = "0.3.1"
description = "A firewall for LLMs — block prompt injection, jailbreaks, and PII exfiltration in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mithril contributors" }]
keywords = [
    "llm", "security", "prompt-injection", "jailbreak", "ai-security",
    "guardrails", "openai-proxy", "llm-firewall", "owasp-llm-top-10",
    "prompt-firewall", "ai-firewall",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "langchain-core>=0.2",
    "litellm>=1.40",
]
langchain = ["langchain-core>=0.2"]
litellm   = ["litellm>=1.40"]
fastapi   = []  # FastAPI is already a core dependency; this extra exists for documentation parity.
all       = [
    "langchain-core>=0.2",
    "litellm>=1.40",
]

[project.scripts]
mithril = "mithril.cli:app"

[project.urls]
Homepage      = "https://github.com/AaronGrillot98/mithril"
Repository    = "https://github.com/AaronGrillot98/mithril"
Issues        = "https://github.com/AaronGrillot98/mithril/issues"
Changelog     = "https://github.com/AaronGrillot98/mithril/blob/main/CHANGELOG.md"
Documentation = "https://github.com/AaronGrillot98/mithril#readme"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mithril*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
