services:
  mithril:
    build: .
    image: mithril:latest
    container_name: mithril
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Proxy
      MITHRIL_UPSTREAM_URL: https://api.openai.com/v1
      MITHRIL_MODE: block
      MITHRIL_THRESHOLD: 0.7

      # LLM judge — set MITHRIL_JUDGE_ENABLED=true and provide an API key
      # (or point JUDGE_BASE_URL at a local Ollama/vLLM endpoint).
      MITHRIL_JUDGE_ENABLED: ${MITHRIL_JUDGE_ENABLED:-false}
      MITHRIL_JUDGE_PROVIDER: openai_compat
      MITHRIL_JUDGE_BASE_URL: ${MITHRIL_JUDGE_BASE_URL:-https://api.openai.com/v1}
      MITHRIL_JUDGE_MODEL: ${MITHRIL_JUDGE_MODEL:-gpt-4o-mini}
      MITHRIL_JUDGE_API_KEY: ${MITHRIL_JUDGE_API_KEY:-}

    volumes:
      - mithril-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mithril-data:
