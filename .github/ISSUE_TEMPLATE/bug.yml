name: 🐛 Bug report
description: Something Mithril does that it shouldn't.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. **If the bug is a missed attack pattern, use the "Attack pattern submission" template instead — that's not a bug, it's a feature request.**
  - type: input
    id: version
    attributes:
      label: Mithril version
      description: Output of `mithril version` or commit SHA.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands or HTTP requests we can run to see the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python version, any non-default config.
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.12.3
        Install method: install.sh / docker / pip
        Judge enabled: yes/no
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant server output or stack trace. Redact any API keys.
      render: shell
