name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run benchmark
        run: python scripts/benchmark.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy mithril

  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip "bandit[toml]"
      - run: bandit -c pyproject.toml -r mithril

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e .
      # --skip-editable drops the project itself (installed via -e .) from
      # the audit — otherwise pip-audit tries to look the local 0.6.0 up on
      # PyPI before it has been published and fails. We do NOT use --strict
      # because that treats the editable self-skip as an error; plain
      # pip-audit still exits non-zero on any real vulnerability finding.
      # Add --ignore-vuln <GHSA-id> with a justified reason for any false
      # positives that creep in.
      #
      # PYSEC-2026-161 (starlette Host-header path injection): mitigated in
      # Mithril by reading scope["path"] instead of request.url.path in
      # security-sensitive code (see _should_scan + access logger) and by
      # stripping the Host header before forwarding upstream. The fix is in
      # starlette 1.0.1 but we cannot bump it yet because
      # prometheus-fastapi-instrumentator pins starlette<1.0.0. Drop this
      # ignore once that pin relaxes.
      - run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-161
